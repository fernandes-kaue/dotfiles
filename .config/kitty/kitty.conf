font_family      FiraMono Nerd Font Mono
font_size        13.0
bold_font        auto
italic_font      auto
bold_italic_font auto

cursor_trail 1

background_opacity 1.0
confirm_os_window_close 0
shell_integration enabled
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Ghostty keeps 10,000,000 lines by default and copies selected text.
scrollback_lines 10000000
copy_on_select yes
wheel_scroll_min_lines 1

enable_audio_bell no
hide_window_decorations yes

tab_bar_edge top
tab_bar_style powerline
tab_bar_min_tabs 2
tab_title_template " {index}: {title} "
active_tab_title_template " {index}: {title} "

# Mirror the Ghostty shortcuts and split-pane workflow.
enabled_layouts splits:split_axis=horizontal
map ctrl+shift+n launch --type=os-window
map ctrl+shift+q close_os_window
map ctrl+w close_window
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+shift+e launch --location=vsplit
map ctrl+shift+o launch --location=hsplit
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right

window_padding_width 4

include ~/.config/kitty/colors.conf
