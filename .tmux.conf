# Fix colors for Ghostty/Neovim
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable mouse support for resizing
set -g mouse on

# Use Vim keys for switching panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use system clipboard (Wayland)
set -s set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Eliminate escape sequence delay (essential for Neovim)
set -s escape-time 0

# Increase scrollback buffer (default is 2000)
set -g history-limit 50000

# Refresh status line more frequently
set -g status-interval 5

# Window and pane indexing at 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Enable vi keys in copy mode
setw -g mode-keys vi

# Visual selection (v) and block toggle (C-v) like Vim
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Synchronize panes (send input to all panes in window)
bind y set-window-option synchronize-panes

# Status bar styling
set -g status-style bg=default,fg=white
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=white]| "
set -g status-right "#[fg=yellow]%H:%M #[fg=white]%d-%b-%y"

# Active/Inactive pane borders
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=blue


# Set prefix to Control + Space (Common ergonomic choice)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload configuration quickly
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Use C-h/j/k/l without prefix for pane switching (Vim-Tmux-Navigator style)
# Requires 'christoomey/vim-tmux-navigator' in Neovim for seamless transition
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# Open new panes/windows in current working directory
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resizing panes (Prefix + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Better pane switching logic (cycle through last window)
bind Tab last-window

# Ensure focused events are passed through to Neovim (for autoread)
set -g focus-events on

# Improved status bar for Ghostty transparency
set -g status-position top
set -g window-status-current-format "#[fg=magenta,bold] #I:#W#F "
set -g window-status-format "#[fg=brightblack] #I:#W#F "
